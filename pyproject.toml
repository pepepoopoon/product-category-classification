[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "product-category-classification"
version = "0.1.0"
description = "Классификация товарных заголовков без утечки между продавцами"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
product-generate-smoke = "product_category_classification.demo_data:main"
product-train = "product_category_classification.train:main"
product-evaluate = "product_category_classification.evaluate:main"
product-predict = "product_category_classification.predict:main"

[tool.hatch.build.targets.wheel]
packages = ["src/product_category_classification"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
